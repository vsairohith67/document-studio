name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.lock.txt
      - name: Install locked validation dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-validation.lock.txt
      - name: Validate repository specifications
        run: python -B scripts/validate_repo.py
      - name: Check internal Markdown links
        run: python -B scripts/check_links.py

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and test frontend contracts
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Compile Tauri without a bundle
        run: npm --workspace @document-studio/desktop run tauri -- build --no-bundle
