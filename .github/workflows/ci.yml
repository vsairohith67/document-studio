name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install locked validation dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-validation.lock.txt'
      - name: Validate repository specifications
        run: |
          python -B scripts/validate_repo.py
          python -B scripts/test_validate_repo_g03.py
      - name: Check internal Markdown links
        run: python -B scripts/check_links.py

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Restore Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.0.6'
      - name: Verify signed qpdf bundle and reviewed runtime tree
        shell: pwsh
        run: |
          $reviewed = (Resolve-Path '.\apps\desktop\src-tauri\resources\qpdf\12.3.2').Path
          $fresh = Join-Path $env:RUNNER_TEMP 'document-studio-qpdf-ci-12.3.2'
          if (Test-Path -LiteralPath $fresh) {
            throw "Refusing to overwrite CI acquisition directory: $fresh"
          }
          .\scripts\acquire-qpdf.ps1 -Destination $fresh
          .\scripts\verify-qpdf-bundle.ps1 -BundleRoot $reviewed
          .\scripts\verify-qpdf-bundle.ps1 -BundleRoot $fresh
          $reviewedFiles = Get-ChildItem -LiteralPath $reviewed -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($reviewed.Length + 1)
            "$relative|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
          }
          $freshFiles = Get-ChildItem -LiteralPath $fresh -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($fresh.Length + 1)
            "$relative|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
          }
          $difference = @(Compare-Object $reviewedFiles $freshFiles)
          if ($difference.Count -ne 0) {
            $difference | Format-Table | Out-String | Write-Output
            throw 'Fresh signed qpdf acquisition differs from the reviewed resource tree.'
          }
      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts
      - name: Stage and verify local G03 renderer boundary
        run: |
          npm run stage:pdfjs --workspace @document-studio/desktop
          npm run test:pdfjs-assets --workspace @document-studio/desktop
          npm run verify:g03 --workspace @document-studio/desktop
      - name: Typecheck and test frontend contracts
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:g03 --workspace @document-studio/desktop
          npm run verify:g04a --workspace @document-studio/desktop
          npm run verify:g04b --workspace @document-studio/desktop
          npm run verify:g04b2 --workspace @document-studio/desktop
      - name: Install locked project-local Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
        run: npm exec --workspace @document-studio/desktop -- playwright install chromium
      - name: Test real PDF.js worker, canvas, text and range behavior
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
        run: npm run test:browser --workspace @document-studio/desktop
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Prove G03 core operations and multi-output recovery
        run: cargo test -p document-studio --locked --features test-runtime --test pdf_operations --test recovery -- --test-threads=1
      - name: Prove qpdf AppContainer and owned Job Object boundary
        run: cargo test -p document-studio --locked --features test-runtime --test process_sandbox -- --test-threads=1
      - name: Prove Windows single-instance startup boundary
        run: |
          cargo build -p document-studio --locked --features test-runtime
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_single_instance.ps1 -Executable .\target\debug\document-studio.exe
      - name: Prove real WebView2 viewer and G04B2 raw IPC
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.cache\ms-playwright
        run: npm run test:webview2 --workspace @document-studio/desktop
      - name: Compile Tauri without a bundle
        run: |
          npm --workspace @document-studio/desktop run tauri -- build --no-bundle
          powershell -NoProfile -ExecutionPolicy Bypass -File .\apps\desktop\scripts\test-production-webview2-arguments.ps1
          npm run verify:g03 --workspace @document-studio/desktop
      - name: Save Cargo dependency cache on trusted main
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
