name: Feature request
description: Propose a focused workflow or capability.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the job to be done rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow and acceptance evidence
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Expected execution path
      options:
        - Desktop local
        - Browser local
        - Optional cloud
        - Mobile capture
        - Not sure
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, performance or licensing considerations
