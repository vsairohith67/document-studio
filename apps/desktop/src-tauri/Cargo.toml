[package]
name = "document-studio"
version = "0.1.0"
description = "Document Studio desktop application"
authors = ["Document Studio"]
edition = "2021"
default-run = "document-studio"

[lib]
name = "document_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = { version = "~0.4.45", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
pdf-writer = { version = "=0.15.0", default-features = false }
rusqlite = { version = "~0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "~0.11.0"
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dialog = "~2.7.2"
tauri-plugin-single-instance = "~2.4.3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "~0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
junction = "~2.0.0"
tempfile = "~3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
test-runtime = []

[[bin]]
name = "sandbox-probe"
path = "src/bin/sandbox_probe.rs"
required-features = ["test-runtime"]
